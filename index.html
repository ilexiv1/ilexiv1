<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ilexiv</title>
<meta name="description" content="ilexiv — Developer, Gamer, Tech Enthusiast">
<meta name="theme-color" content="#0a0b0d">

<meta property="og:title" content="ilexiv">
<meta property="og:description" content="Developer · Gamer · Tech Enthusiast">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ilexiv.ir/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="ilexiv">
<meta name="twitter:description" content="Developer · Gamer · Tech Enthusiast">

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0b0d'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='58' font-family='monospace' font-weight='700' fill='%23ffb454'%3E~%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0a0b0d;
    --panel:#111215;
    --panel-2:#0d0e11;
    --text:#e9e6df;
    --muted:#6f7480;
    --dim:#4b4f58;
    --border:rgba(255,255,255,.09);
    --amber:#ffb454;
    --amber-dim:#8a6a3a;
    --red:#ff5f57;
    --yellow:#febc2e;
    --green:#28c840;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    color:var(--text);
    background:var(--bg);
    position:relative;
    overflow:hidden;
}

/* ambient */
.vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%);
    z-index:2;
}

.scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.02) 0px,
        rgba(255,255,255,.02) 1px,
        transparent 1px,
        transparent 3px
    );
    z-index:2;
    opacity:.5;
}

.glow{
    position:fixed;
    width:640px;
    height:640px;
    top:50%;
    left:50%;
    transform:translate(-50%,-55%);
    background:radial-gradient(circle, rgba(255,180,84,.10), transparent 65%);
    filter:blur(10px);
    pointer-events:none;
    z-index:0;
}

.noise-dot{
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:3px 3px;
    z-index:2;
    opacity:.4;
}

/* terminal window */
.term{
    position:relative;
    z-index:1;
    width:min(640px,100%);
    border-radius:12px;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 0 1px rgba(0,0,0,.3),
        0 0 90px rgba(255,180,84,.05);
    overflow:hidden;
    animation:rise .6s cubic-bezier(.16,1,.3,1) both;
}

@keyframes rise{
    from{opacity:0; transform:translateY(14px) scale(.985);}
    to{opacity:1; transform:translateY(0) scale(1);}
}

.term-bar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 16px;
    background:var(--panel-2);
    border-bottom:1px solid var(--border);
}

.dots{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.dot{
    width:11px;
    height:11px;
    border-radius:50%;
}

.dot.r{background:var(--red);}
.dot.y{background:var(--yellow);}
.dot.g{background:var(--green);}

.term-title{
    flex:1;
    text-align:center;
    font-size:.78rem;
    color:var(--muted);
    letter-spacing:.02em;
    padding-right:43px;
}

.term-body{
    padding:30px 26px 26px;
    font-size:.92rem;
    line-height:1.7;
    min-height:340px;
}

.ln{
    white-space:pre-wrap;
    word-break:break-word;
}

.prompt{
    color:var(--amber);
}

.path{
    color:#8fd3ff;
}

.cmd{
    color:var(--text);
}

.out{
    color:var(--muted);
    padding-left:0;
}

.logo-line{
    font-size:2.1rem;
    font-weight:800;
    letter-spacing:-1px;
    color:var(--text);
    margin:2px 0 2px;
}

.bio-line{
    color:var(--muted);
    margin-bottom:18px;
}

.bio-line .sep{
    color:var(--dim);
    margin:0 8px;
}

.contacts{
    display:flex;
    flex-direction:column;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    margin:6px 0 20px;
}

.contact{
    text-decoration:none;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border-bottom:1px solid var(--border);
    background:transparent;
    transition:background .15s ease, padding-left .15s ease;
    font-size:.88rem;
}

.contact:last-child{
    border-bottom:none;
}

.contact:hover{
    background:rgba(255,180,84,.06);
    padding-left:20px;
}

.contact:hover .arrow{
    opacity:1;
    transform:translateX(0);
}

.contact-key{
    color:var(--amber-dim);
    width:92px;
    flex-shrink:0;
}

.contact:hover .contact-key{
    color:var(--amber);
}

.contact-val{
    color:var(--text);
    flex:1;
}

.contact-val{
    overflow:hidden;
    text-overflow:ellipsis;
}

.arrow{
    color:var(--amber);
    opacity:0;
    transform:translateX(-4px);
    transition:.15s ease;
    flex-shrink:0;
}

.cursor-line{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
}

.cursor{
    display:inline-block;
    width:8px;
    height:16px;
    background:var(--amber);
    animation:blink 1s steps(1) infinite;
    vertical-align:middle;
}

@keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
}

.type-target::after{
    content:"";
}

.footer{
    margin-top:22px;
    text-align:center;
    color:var(--dim);
    font-size:.76rem;
    letter-spacing:.02em;
    position:relative;
    z-index:1;
}

.footer a{
    color:var(--dim);
}

@media (max-width:600px){
    .term-body{
        padding:22px 16px 20px;
        font-size:.85rem;
    }
    .logo-line{
        font-size:1.7rem;
    }
    .contact-key{
        width:76px;
    }
    .glow{
        width:420px;
        height:420px;
    }
}

@media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
    }
}
</style>
</head>
<body>

<div class="glow"></div>
<div class="scanlines"></div>
<div class="noise-dot"></div>
<div class="vignette"></div>

<main>
    <div class="term" role="main" aria-label="ilexiv contact terminal">
        <div class="term-bar">
            <div class="dots">
                <span class="dot r"></span>
                <span class="dot y"></span>
                <span class="dot g"></span>
            </div>
            <div class="term-title">ilexiv@web&nbsp;&mdash;&nbsp;~</div>
        </div>

        <div class="term-body">
            <div class="ln"><span class="prompt">ilexiv@web</span><span class="path">:~$</span> <span class="cmd">whoami</span></div>
            <div class="logo-line">ilexiv</div>
            <div class="bio-line">Developer<span class="sep">·</span>Gamer<span class="sep">·</span>Tech Enthusiast</div>

            <div class="ln"><span class="prompt">ilexiv@web</span><span class="path">:~$</span> <span class="cmd">cat contacts.json</span></div>

            <div class="contacts">
                <a class="contact" href="/blog/">
                    <span class="contact-key">blog</span>
                    <span class="contact-val">/blog</span>
                    <span class="arrow">&rarr;</span>
                </a>
                <a class="contact" href="https://t.me/ilexiv1" target="_blank" rel="noopener">
                    <span class="contact-key">telegram</span>
                    <span class="contact-val">@ilexiv1</span>
                    <span class="arrow">&rarr;</span>
                </a>
                <a class="contact" href="https://instagram.com/ilexiv1" target="_blank" rel="noopener">
                    <span class="contact-key">instagram</span>
                    <span class="contact-val">@ilexiv1</span>
                    <span class="arrow">&rarr;</span>
                </a>
                <a class="contact" href="mailto:ilexiv@proton.me">
                    <span class="contact-key">email</span>
                    <span class="contact-val">ilexiv@proton.me</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </div>

            <div class="cursor-line">
                <span><span class="prompt">ilexiv@web</span><span class="path">:~$</span></span>
                <span class="cursor" aria-hidden="true"></span>
            </div>
        </div>
    </div>

    <div class="footer">&copy; 2026 ilexiv &nbsp;&middot;&nbsp; built on GitHub Pages</div>
</main>

</body>
</html>
