<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | xml_escape }}">
<meta name="theme-color" content="#0a0b0d">
{% seo %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/rss.xml' | relative_url }}">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0b0d'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='58' font-family='monospace' font-weight='700' fill='%23ffb454'%3E~%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
</head>
<body>

<div class="glow"></div>
<div class="scanlines"></div>
<div class="noise-dot"></div>
<div class="vignette"></div>

<div class="wrap">
    <div class="term">
        <div class="term-bar">
            <div class="dots">
                <span class="dot r"></span>
                <span class="dot y"></span>
                <span class="dot g"></span>
            </div>
            <div class="term-title">ilexiv@web&nbsp;&mdash;&nbsp;{% if page.layout == 'post' %}~/blog/{{ page.slug }}{% elsif page.url == '/blog/tags/' %}~/blog/tags{% else %}~/blog{% endif %}</div>
        </div>

        <div class="term-body">
            {{ content }}
        </div>
    </div>

    <div class="footer">
        &copy; {{ site.time | date: '%Y' }} {{ site.author }}
        {% if site.home_url %} &nbsp;&middot;&nbsp; <a href="{{ site.home_url }}">ilexiv.ir</a>{% endif %}
        &nbsp;&middot;&nbsp; <a href="{{ '/rss.xml' | relative_url }}">rss</a>
    </div>
</div>

</body>
</html>
